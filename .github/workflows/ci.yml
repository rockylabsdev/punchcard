name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow as its gate before GoReleaser runs.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # go.mod's toolchain directive pins the Go version; setup-go reads it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test -race
        run: go test -race ./...

      # The slice 1 hand check: the envelope prints on both runners.
      - name: punchcard version --json
        run: go run ./cmd/punchcard version --json

      # The Claude Code plugin's pure logic (band text, branch key, the
      # stop --yes gate): Node's built-in test runner, no npm dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: plugin logic (node --test)
        run: node --test plugin/test/logic.test.mjs

      # The stop --yes gate against Claude Code's own engine. It needs no
      # login: a fresh, empty CLAUDE_CONFIG_DIR and no API key. Pinned to
      # the version it was checked with.
      - name: plugin gate (claude plugin test)
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.295
          claude plugin test plugin
