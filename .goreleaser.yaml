# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release config (ADR 0007). Runs from .github/workflows/release.yml on a
# v* tag, after the CI workflow passes. Check locally with
#   go run github.com/goreleaser/goreleaser/v2@latest check
#   go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean
version: 2
project_name: punchcard

builds:
  - id: punchcard
    main: ./cmd/punchcard
    binary: punchcard
    env:
      # No cgo: the Keychain is reached through /usr/bin/security and flock
      # through syscall, so one static binary per target.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # `punchcard version --json` reports this; the mod's band and setup's
    # plugin step compare it with the plugin's own version (no leading v).
    ldflags:
      - -s -w -X github.com/j-dsmith/punchcard/internal/cli.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^Release v"]

release:
  github:
    owner: j-dsmith
    name: punchcard

# A Homebrew FORMULA, on purpose, although GoReleaser deprecates `brews` in
# favour of `homebrew_casks`. Homebrew sets com.apple.quarantine on cask
# downloads but never on formula installs, and ADR 0007 rests on that: the
# binary is unsigned and not notarised, and `brew install` must not raise a
# Gatekeeper prompt. A cask would need a post-install `xattr -dr` hook to
# undo the flag. Keep the formula until GoReleaser removes `brews`, then
# revisit ADR 0007.
brews:
  - name: punchcard
    repository:
      owner: j-dsmith
      name: homebrew-tap # brew drops "homebrew-": j-dsmith/tap/punchcard
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/j-dsmith/punchcard"
    description: "Terminal-native Jira time tracker: a TUI and a CLI over one core"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    install: |
      bin.install "punchcard"
    test: |
      system "#{bin}/punchcard", "version"
